<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH OS</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 20% 20%, #1e1b4b, #0f172a 80%);
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --mic-active: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body { 
            background: var(--bg-gradient); 
            color: var(--text); 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Menu de gauche (Sidebar Glass) */
        .sidebar { 
            width: 280px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-right: 1px solid var(--glass-border); 
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }

        .chat-container { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .message { 
            max-width: 80%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            line-height: 1.5; 
            white-space: pre-wrap; 
            backdrop-filter: blur(8px);
        }

        .user-msg { 
            background: rgba(37, 99, 235, 0.75); 
            align-self: flex-end; 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
        }

        .bot-msg { 
            background: var(--glass-bg); 
            align-self: flex-start; 
            border: 1px solid var(--glass-border); 
        }

        /* Menu du bas (Input Glass) */
        .input-area { 
            padding: 20px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex; 
            gap: 10px; 
            border-top: 1px solid var(--glass-border); 
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.3);
        }

        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--glass-border); 
            background: rgba(15, 23, 42, 0.6); 
            color: white; 
            outline: none; 
            transition: border 0.2s;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        button { 
            padding: 12px 18px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover { background: var(--accent-hover); }

        .btn-mic { 
            background: rgba(51, 65, 85, 0.6); 
            border: 1px solid var(--glass-border); 
            font-size: 1.1em;
        }

        .btn-mic.recording { 
            background: var(--mic-active); 
            animation: pulse 1.5s infinite; 
        }

        .btn-danger { background: rgba(220, 38, 38, 0.8); }
        .btn-danger:hover { background: #b91c1c; }

        .file-label { 
            padding: 12px; 
            background: rgba(51, 65, 85, 0.5); 
            border: 1px solid var(--glass-border); 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: center; 
        }

        input[type="file"] { display: none; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>GLITCH OS</h2>
        <p style="color: var(--text-dim); font-size: 0.9em;">Core Intelligence</p>
        <hr style="border-color: var(--glass-border);">
        <label class="file-label">
            📷 Importer Fichier / Image
            <input type="file" id="fileInput" onchange="uploadFile()">
        </label>
        <button class="btn-danger" onclick="clearMemory()">Effacer la mémoire</button>
    </div>

    <div class="main">
        <div class="chat-container" id="chatContainer">
            <div class="message bot-msg">Système GLITCH prêt. Comment puis-je t'aider ?</div>
        </div>
        <div class="input-area">
            <button class="btn-mic" id="micBtn" onclick="toggleVoiceInput()" title="Parler à GLITCH">🎙️</button>
            <input type="text" id="userInput" placeholder="Demande une action ou parle avec le micro..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;

        // Configuration de la reconnaissance vocale (Speech-To-Text)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendMessage(); // Envoi automatique après dictée
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('recording');
            };

            recognition.onerror = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('recording');
            };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert("Reconnaissance vocale non supportée sur ce navigateur.");
                return;
            }
            const micBtn = document.getElementById('micBtn');
            if (isListening) {
                recognition.stop();
                isListening = false;
                micBtn.classList.remove('recording');
            } else {
                recognition.start();
                isListening = true;
                micBtn.classList.add('recording');
            }
        }

        function jouerAudio(url) {
            if (!url) return;
            const audio = new Audio(url + '?t=' + new Date().getTime());
            audio.play().catch(e => console.log("Autoplay bloqué :", e));
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            appendMessage(msg, 'user-msg');
            input.value = '';

            const botMsgDiv = appendMessage("GLITCH réfléchit...", 'bot-msg');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                botMsgDiv.textContent = data.response || "Erreur de réponse.";
                
                if (data.audio_url) {
                    jouerAudio(data.audio_url);
                }
            } catch (e) {
                botMsgDiv.textContent = "Erreur de connexion serveur.";
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            appendMessage(`Envoi du fichier : ${fileInput.files[0].name}...`, 'user-msg');
            const botMsgDiv = appendMessage("Analyse en cours...", 'bot-msg');

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                botMsgDiv.textContent = data.apercu || "Fichier importé avec succès.";
            } catch (e) {
                botMsgDiv.textContent = "Échec du transfert.";
            }
        }

        async function clearMemory() {
            if (confirm("Réinitialiser toute la mémoire de GLITCH ?")) {
                await fetch('/api/memory', { method: 'DELETE' });
                document.getElementById('chatContainer').innerHTML = '<div class="message bot-msg">Mémoire réinitialisée.</div>';
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
